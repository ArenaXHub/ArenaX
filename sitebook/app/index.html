/*@/FONTS*/
:root{
  --surface:#F1F1EE;--raised:#F9F9F7;--card:#FFFFFF;--well:#E8E8E3;--ink:#17181A;--on-ink:#FFFFFF;--muted:#5B5D60;--rule:#D9D9D4;
  --marigold:#E3A21A;--on-marigold:#141414;--link:#8A5A00;--focus:#1F5FBF;
  --good:#1F7A4D;--good-soft:#E1F1E7;--good-line:#A9D3B9;--watch:#8A5A00;--watch-soft:#FBF0D6;--watch-line:#EBCB85;--act:#B23A0E;--act-soft:#F9E0D8;--act-line:#E9B3A3;
  --c-billed:#2B6CB0;--c-wages:#E3A21A;--c-bachat:#1F7A4D;--c-loss:#B23A0E;
  --gold-soft:rgba(227,162,26,.18);--paper:#FBF7EA;--paper-rule:#D8CCA6;--paper-head:rgba(216,204,166,.35);
  --scrim:rgba(241,241,238,.97);--stamp-bg:rgba(255,255,255,.94);
  --display:"SBRupee","Manrope","Segoe UI",Roboto,system-ui,sans-serif;
  --body:"SBRupee","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --lift:0 20px 40px -22px rgba(10,10,10,.38);--soft:0 2px 8px rgba(10,10,10,.06);
  color-scheme:light;
}
html[data-theme="dark"]{
  --surface:#121314;--raised:#1A1B1D;--card:#1E2022;--well:#26282B;--ink:#EDEDEA;--on-ink:#121314;--muted:#A6A8AB;--rule:#34373A;
  --marigold:#E3A21A;--on-marigold:#141414;--link:#E8B54A;--focus:#7AA7FF;
  --good:#4CB782;--good-soft:#173527;--good-line:#2C6A4B;--watch:#E8B54A;--watch-soft:#3A2E12;--watch-line:#6B5520;--act:#F07B57;--act-soft:#3D1F16;--act-line:#7A3A26;
  --c-billed:#6EA8E8;--c-wages:#E3A21A;--c-bachat:#4CB782;--c-loss:#F07B57;
  --gold-soft:rgba(227,162,26,.22);--paper:#22211C;--paper-rule:#4A4636;--paper-head:rgba(120,110,80,.28);
  --scrim:rgba(18,19,20,.96);--stamp-bg:rgba(30,32,34,.96);
  --lift:0 20px 40px -22px rgba(0,0,0,.7);--soft:0 2px 8px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
html[data-lang=hi]{--display:"SBRupee","Manrope","Mukta","Nirmala UI","Noto Sans Devanagari",system-ui,sans-serif;--body:"SBRupee","Inter","Mukta","Nirmala UI","Noto Sans Devanagari",system-ui,sans-serif}
.langs button[data-lang=hi]{font-family:"SBHindi","Nirmala UI","Noto Sans Devanagari",sans-serif}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-0.02em;margin:0}
h1{font-size:clamp(28px,6vw,40px);line-height:1.08;font-weight:800;letter-spacing:-0.03em}
h2{font-size:clamp(22px,4vw,28px);line-height:1.15;font-weight:800}
h3{font-size:18px;line-height:1.25;font-weight:700}
.h4{font-size:16px;font-weight:700;line-height:1.3}
p{margin:0}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ico{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em;flex:none}
.money{font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:18px;min-width:0;box-shadow:var(--soft)}
.tag{display:inline-block;width:max-content;font:600 12px/1 var(--mono);letter-spacing:.06em;padding:6px 9px;border-radius:5px}
.tag.run{background:var(--marigold);color:var(--on-marigold)}
.tag.soft{border:1px solid var(--rule);color:var(--muted);background:var(--raised)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;font:600 15px/1.2 var(--body);border:1px solid var(--rule);color:var(--ink);background:var(--card);cursor:pointer;text-decoration:none}
.btn:hover{text-decoration:none}
.btn.primary{background:var(--marigold);color:var(--on-marigold);border-color:var(--marigold)}
.btn.ink{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.small{min-height:38px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.lift{transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s}
@media (hover:hover){.lift:hover{transform:translateY(-3px);box-shadow:var(--lift),0 0 0 1px rgba(227,162,26,.3),0 0 26px -6px rgba(227,162,26,.5)}}
.lift:active,.btn:active{transform:scale(.97)!important;transition-duration:.08s}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:4px 10px;color:var(--muted);min-height:32px;cursor:pointer}
.chip.on{color:var(--ink);border-color:var(--marigold);background:var(--gold-soft)}

/* top: demo bar + header */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 16px;background:var(--watch-soft);color:var(--ink);border-bottom:1px solid var(--watch-line);font-size:13px;font-weight:600}
.demo-bar .ico{color:var(--watch)}
.demo-bar .chip{background:var(--card);color:var(--ink);font-weight:600;min-height:34px;white-space:nowrap}
.demo-bar .chip.warn{border-color:var(--act);color:var(--act)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;max-width:1100px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;color:var(--ink);font:800 18px/1 var(--display);letter-spacing:-.02em;min-width:0}
.logo:hover{text-decoration:none}
.logo .mark{width:34px;height:34px;flex:none}
.logo .tag{font-size:10px;padding:4px 6px}
.tools{display:flex;align-items:center;gap:6px}
.langs{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--raised);gap:2px}
.langs button{border:0;background:transparent;border-radius:999px;padding:6px 9px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);min-height:34px}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.themewrap{position:relative}
.iconbtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--rule);background:var(--raised);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn .ico{width:20px;height:20px}
.menu{position:absolute;right:0;top:46px;background:var(--card);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--lift);padding:6px;display:grid;gap:2px;min-width:170px;z-index:30}
.menu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer;font-size:14px;font-weight:600}
.menu button[aria-checked="true"]{background:var(--gold-soft)}
.menu button:hover{background:var(--raised)}

/* layout */
main{max-width:1100px;margin:0 auto;padding:18px 16px 96px}
.stack{display:grid;gap:16px}
.narrow{max-width:560px;margin:0 auto}
.rolebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rolebar .who{display:flex;align-items:center;gap:10px;font-weight:700}
.rolebar .who .ric{width:40px;height:40px;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center}
.rolebar .who .ric .ico{width:22px;height:22px}
.rolebar small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.pickers{display:flex;gap:10px;flex-wrap:wrap}
.pickers label,.field{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
select,input[type=number],input[type=tel],input[type=text]{min-height:44px;border:1px solid var(--rule);border-radius:10px;padding:8px 12px;font-weight:600;background:var(--card);color:var(--ink);max-width:100%}
.seg{display:flex;gap:4px;border:1px solid var(--rule);border-radius:12px;padding:4px;background:var(--raised);overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;min-height:40px;padding:6px 12px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--well);color:var(--muted)}

/* login */
.login{display:grid;gap:18px}
.login .lead{color:var(--muted)}
.otp{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.otp .field{flex:1 1 200px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.rolecard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px;cursor:pointer;min-height:76px;color:var(--ink)}
.rolecard .ric{width:46px;height:46px;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center}
.rolecard .ric .ico{width:26px;height:26px}
.rolecard b{display:block;font:700 16px/1.25 var(--display)}
.rolecard small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px}
.rolecard .go{color:var(--muted)}
.rolecard .lvl{display:inline-block;margin-top:6px;font:600 11px/1 var(--mono);letter-spacing:.04em;padding:4px 6px;border-radius:5px;border:1px solid var(--rule);color:var(--muted)}

/* munshi (same components as the website's phone) */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:16px}
.mhead small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tally div{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:6px 4px;text-align:center;font-size:12px;color:var(--muted);line-height:1.25}
.tally b{display:block;font:800 21px/1.15 var(--display);color:var(--ink)}
.tally .t-abs b{color:var(--act)}.tally .t-ok b{color:var(--good)}.tally .t-km b{font-size:17px;line-height:1.4}
.wlist{display:grid;gap:10px}
.wcard{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;display:grid;gap:8px}
.wcard.done{border-color:var(--good);box-shadow:0 0 0 2px rgba(31,122,77,.14)}
.wcard.absent{border-color:var(--act)}
.wrow{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 var(--display);color:#fff;flex:none}
.wname{font-weight:700;font-size:15px;line-height:1.2;flex:1;min-width:0}
.wname small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.wstate{min-width:24px;display:flex;justify-content:flex-end}.wstate .ico{width:24px;height:24px}
.hbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hbtn{border:1px solid var(--rule);background:var(--surface);border-radius:12px;min-height:56px;display:grid;place-items:center;gap:2px;padding:6px 2px;cursor:pointer;font-size:11px;font-weight:600;line-height:1.1;color:var(--ink)}
.hbtn b{display:flex;gap:1px;line-height:1}.hbtn .ico{width:22px;height:22px}
.hbtn[aria-pressed="true"]{background:var(--marigold);border-color:var(--marigold);color:var(--on-marigold)}
.hbtn.abs[aria-pressed="true"]{background:var(--act-soft);border-color:var(--act);color:var(--ink)}
.hbtn:disabled{cursor:default;opacity:.55}
.wtools{display:flex;align-items:center;gap:6px;justify-content:space-between}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.stepper button{width:44px;height:40px;border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--ink)}
.stepper output{min-width:56px;text-align:center;font-weight:700;font-size:13px}
.advbtn{border:1px solid var(--rule);background:var(--surface);border-radius:999px;min-height:40px;padding:0 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.advbtn.has{background:var(--gold-soft);border-color:var(--marigold)}
.mfoot{position:sticky;bottom:0;z-index:10;padding:10px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--surface) 78%,transparent);display:grid;gap:8px}
.footrow{display:flex;gap:8px}.footrow>*{flex:1}
.bigbtn{min-height:52px;border-radius:14px;font-weight:700;font-size:15px;line-height:1.15;padding:6px 10px;border:1px solid var(--rule);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.bigbtn:active{transform:scale(.96)}
.bigbtn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.bigbtn.gold{background:var(--marigold);border-color:var(--marigold);color:var(--on-marigold)}
.bigbtn:disabled{opacity:.45;cursor:default}
.lockbar{display:flex;align-items:center;gap:10px;background:var(--good-soft);border:1px solid var(--good-line);color:var(--good);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.notebtn{border:0;background:transparent;padding:0;cursor:pointer;border-radius:10px;min-height:44px}
.notebtn svg{width:100%;height:auto;display:block;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.notebtn:active svg{transform:scale(.92)}
.advsum{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:6px 2px}
.paper{background:var(--paper);border:1px solid var(--paper-rule);border-radius:10px;overflow:auto;font-family:var(--mono);font-size:12px;max-width:100%}
.paper table{border-collapse:collapse;min-width:100%}
.paper th,.paper td{border:1px solid var(--paper-rule);padding:4px 6px;text-align:center;white-space:nowrap}
.paper th{background:var(--paper-head);font-weight:600}
.paper td:first-child,.paper th:first-child{text-align:left;position:sticky;left:0;background:var(--paper);font-family:var(--body);font-weight:600;min-width:96px;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.paper td.a{color:var(--act);font-weight:700}.paper td.l{color:var(--muted)}.paper td.today{background:rgba(227,162,26,.28);font-weight:700}
.paper caption{text-align:left;padding:8px 10px;font-family:var(--body);font-weight:600;font-size:13px}
.success{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;text-align:center;padding:22px;z-index:40;animation:fade .3s var(--ease)}
.success>div{max-width:380px;width:100%}
.success ul{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px;text-align:left}
.success li{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:8px 12px;font-size:14px;animation:slide .4s var(--ease) both}
.success li:nth-child(2){animation-delay:.12s}.success li:nth-child(3){animation-delay:.24s}.success li:nth-child(4){animation-delay:.36s}
.success .bigbtn{margin-top:16px;width:100%}
.stamp{display:inline-flex;align-items:center;gap:6px;transform:rotate(-8deg);border:4px solid var(--good);color:var(--good);background:var(--stamp-bg);font:800 22px/1 var(--display);letter-spacing:.04em;padding:12px 16px;border-radius:12px;margin-bottom:12px;animation:stampIn .5s var(--ease) both;white-space:nowrap}
.stamp .ico{width:24px;height:24px}
@keyframes stampIn{from{opacity:0;transform:rotate(-8deg) scale(2)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* thekedar, hisaab-wala, CA */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--rule);border-radius:16px;padding:14px;display:grid;gap:4px;align-content:start;min-width:0}
.tile-top{display:flex;align-items:center;gap:8px}
.tile-ic .ico{width:24px;height:24px}
.tile-l{font-weight:600;font-size:14px;color:var(--muted)}
.tile-v{font:800 clamp(20px,4.6vw,28px)/1.1 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.tile-s{font-size:13px;color:var(--muted)}
.tile.t-billed{border-top-color:var(--c-billed)}.tile.t-wages{border-top-color:var(--c-wages)}
.tile.t-bachat{border-top-color:var(--good)}.tile.t-bachat .tile-v{color:var(--good)}
.tile.t-bachat.watch{border-top-color:var(--marigold)}.tile.t-bachat.action{border-top-color:var(--act)}.tile.t-bachat.action .tile-v{color:var(--act)}
.tile.t-owed.action{border-top-color:var(--act)}.tile.t-owed.action .tile-v{color:var(--act)}
.tile.t-owed.good{border-top-color:var(--good)}
.state{display:inline-flex;align-items:center;gap:4px;width:max-content;font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px}
.state.good{background:var(--good-soft);color:var(--good)}.state.watch{background:var(--watch-soft);color:var(--watch)}.state.action{background:var(--act-soft);color:var(--act)}
.alerts{display:flex;gap:10px;flex-wrap:wrap}
.alert{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;padding:10px 14px;border-radius:12px;border:1px solid var(--rule);border-left:4px solid var(--rule);background:var(--card)}
.alert .ai .ico{width:22px;height:22px}
.alert.good{border-color:var(--good-line);border-left-color:var(--good);background:var(--good-soft)}
.alert.watch{border-color:var(--watch-line);border-left-color:var(--marigold);background:var(--watch-soft)}
.alert.action{border-color:var(--act-line);border-left-color:var(--act);background:var(--act-soft)}
.alert .al{font:700 11px/1 var(--mono);letter-spacing:.04em;opacity:.85}
.alert.good .al{color:var(--good)}.alert.watch .al{color:var(--watch)}.alert.action .al{color:var(--act)}
.box{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px;display:grid;gap:10px;min-width:0}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tblwrap{overflow-x:auto;max-width:100%;border:1px solid var(--rule);border-radius:12px}
table.data{border-collapse:collapse;width:100%;font-size:14px}
table.data th,table.data td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
table.data th:first-child,table.data td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
table.data thead th{font-size:12px;color:var(--muted);font-weight:700;background:var(--raised)}
table.data thead th:first-child{background:var(--raised)}
table.data tfoot td{font-weight:800}
table.data td.neg{color:var(--act);font-weight:700}
table.data tr.editrow td{background:var(--gold-soft);white-space:normal;text-align:left}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.form .field{flex:1 1 140px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--rule);border-radius:10px;padding:8px 10px;font-size:14px;background:var(--raised)}
.list li small{display:block;color:var(--muted);font-size:12px}
.viz svg{width:100%;height:auto;display:block;overflow:visible}
.viz .gl{stroke:var(--rule)}.viz .bl{stroke:var(--ink)}.viz .ax{fill:var(--muted);font-size:10px}
.viz rect.b{fill:var(--c-bachat)}.viz rect.b.n{fill:var(--c-loss)}.viz rect.b.w{fill:var(--c-wages)}
.viz rect.b:hover{opacity:.8}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.err{display:grid;gap:12px;justify-items:start}
@media (max-width:480px){.seg button{flex:1 1 0;min-width:0;padding:6px 4px;font-size:13px;white-space:normal;line-height:1.15}.seg button .ico{display:none}}
@media (max-width:420px){
  .logo .wm{font-size:16px}
  .langs button{padding:6px 7px}
  .tally b{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function workerCalc(s, m, w) {
